spring:
  # Load .env file from the working directory (must run from backend/).
  # OS environment variables take precedence over .env values.
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    # No default for password — app fails fast with a clear message if missing.
    password: "${DB_PASSWORD}"
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

  jpa:
    # Never let Hibernate touch the schema — Flyway owns migrations.
    hibernate:
      ddl-auto: validate
    # Store all timestamps in UTC so Postgres timestamptz round-trips correctly.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    # Avoid holding a DB connection for the full HTTP request lifecycle.
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  jackson:
    # Write Instant/OffsetDateTime as ISO-8601 strings, not epoch millis.
    serialization:
      write-dates-as-timestamps: false

server:
  # Default port 8081; override with SERVER_PORT env var.
  port: "${SERVER_PORT:8081}"

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000}"

logging:
  level:
    # Show Flyway migration progress in logs without leaking SQL data.
    org.flywaydb: INFO
    com.deadlinemanager: INFO
